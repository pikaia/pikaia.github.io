# Local-only overrides for `jekyll serve`, layered on top of _config.yml with:
#   jekyll serve --config _config.yml,_config_dev.yml
# Not used by GitHub Pages (which builds from _config.yml alone), so production is unaffected.

title: "LOCAL — Lesser Known Singapore"

# Render posts whose date is in the future, so upcoming posts can be
# previewed before their publish time. Local preview only - GitHub Pages
# builds from _config.yml alone and never shows future-dated posts.
future: true

# Show a per-post pipeline-status badge on the homepage (full pipeline /
# audio only / no video). Local preview only - never rendered live.
pipeline_badges: true

# Show the inline "Watch" button (the Ken Burns animation player) in the
# post widget row. Local preview only: in production the button is hidden
# (via a <style> rule in _layouts/post.html) so viewers are routed to the
# YouTube channel links instead. The Listen button and the YouTube /
# Shorts links are unaffected in both environments.
show_watch_widget: true
