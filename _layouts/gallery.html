---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {%- if page.post_url and page.post_title -%}
    <p><a href="{{ page.post_url | relative_url }}">&larr; Back to &ldquo;{{ page.post_title }}&rdquo;</a></p>
    {%- endif -%}
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {%- if page.post_url and page.post_title -%}
  <p><a href="{{ page.post_url | relative_url }}">&larr; Back to &ldquo;{{ page.post_title }}&rdquo;</a></p>
  {%- endif -%}
  <p><a href="{{ '/' | relative_url }}">&larr; Back to all posts</a></p>

</article>
